# ASTC Configuration File Example
# This file contains configuration parameters for ASTC compression testing

[block]
# Block dimensions
width=4
height=4
# Block mode: 0=自动（用decimation_mode/weight_quant/is_dual_plane计算），>0=强制指定block mode
mode=0
# Partition index
partition=1
# Whether the block has alpha channel (true/false)
has_alpha=true
# Whether to use dual plane (true/false)
is_dual_plane=true

[endpoints]
# RGBA endpoint values (8 values: R1,G1,B1,A1,R2,G2,B2,A2)
values=255,255,255,255,255,255,255,255

[weights]
# 4x4 grid, dual plane → 4*4*2=32 weights
count=32

[calculation]
# Parameters for block mode calculation (when mode=0)
decimation_mode=0
weight_quant=QUANT_4   # 可用: QUANT_2, QUANT_3, QUANT_4, QUANT_5, QUANT_6, QUANT_8, QUANT_10, QUANT_12, QUANT_16, QUANT_20, QUANT_24, QUANT_32, QUANT_40, QUANT_48, QUANT_64, QUANT_80, QUANT_96, QUANT_128, QUANT_160, QUANT_192, QUANT_256
is_dual_plane=true

# 说明:
# - mode=0 表示自动根据 decimation/weight_quant/is_dual_plane 计算 block_mode
# - mode>0 表示强制指定 block_mode
# - partition=1 表示单分区
# - has_alpha=true 表示 RGBA
# - is_dual_plane=true 表示双平面
# - weights count=32 (4x4x2)
# - endpoints 全 255 (1.0f)
# - weight_quant=QUANT_4 